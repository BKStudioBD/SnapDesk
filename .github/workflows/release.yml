name: Release

# Tag a version and this builds, notarizes and publishes it: the same ZIP the
# in-app updater downloads, and the same URL the Homebrew cask points at.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# REQUIRED repository secrets (Settings → Secrets and variables → Actions).
# Without them the job still runs and publishes an AD-HOC signed build, which
# Gatekeeper will warn about and the in-app updater will REFUSE to install over a
# Developer-ID copy (it requires the same signer). Set them before shipping:
#
#   MACOS_CERT_P12        base64 of your "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD   password for that .p12
#   MACOS_SIGN_IDENTITY   e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID              Apple ID for notarytool
#   APPLE_TEAM_ID         your 10-character Team ID
#   APPLE_APP_PASSWORD    app-specific password for that Apple ID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release and upload the ZIP

jobs:
  build:
    # A real macOS runner: the build shells out to swiftc, codesign and notarytool.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      # Type-check + the Swift Testing suite. A tag that fails tests must not ship.
      - name: Test
        run: ./test.sh

      - name: Import signing certificate
        if: ${{ secrets.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          # A random password: this keychain lives only for the length of the job.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notarization credentials
        if: ${{ secrets.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials snapdesk-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      # build.sh already signs, notarizes and staples when these are set, so the
      # same script used locally, so CI can't drift from a developer build.
      - name: Build
        env:
          DEV_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.APPLE_ID != '' && 'snapdesk-notary' || '' }}
        # --no-install: a CI runner has no /Applications copy to replace.
        # --zip: produces build/SnapDesk.zip, the asset the in-app updater fetches.
        run: ./build.sh --no-install --zip

      - name: Verify the signature we're about to ship
        run: |
          codesign --verify --deep --strict --verbose=2 build/SnapDesk.app
          codesign -dv build/SnapDesk.app 2>&1 | sed -n 's/^Authority=/signed by: /p'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Release notes come from the tag's own annotation when there is one, so
          # the What's New sheet in the app shows what you actually wrote.
          NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          [ -n "$NOTES" ] || NOTES="SnapDesk $TAG"
          gh release create "$TAG" build/SnapDesk.zip \
            --title "SnapDesk ${TAG#v}" --notes "$NOTES"
